name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev dependencies
        run: npm ci
      - name: Whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      # All suites from package.json "test" (projection, verify-spec,
      # project-status, bdd-traceability, business-verification, viewer).
      # Keep fetch-depth: 0 above (base-branch diff; project:status needs full history).
      - name: Tooling tests
        run: npm test
