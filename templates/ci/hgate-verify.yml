# hGATE adopter CI gate. Copy to .github/workflows/hgate-verify.yml in the
# adopting project. hGATE never installs this for you.
#
# Requires package.json scripts:
#   "project:check":     "node tools/project-projection/generate.mjs --root . --check"
#   "verify:spec":       "node tools/verify-spec/verify.mjs --root ."  (optional, no dependencies)
#   "verify:bdd":        "node tools/bdd-traceability/verify.mjs --root ."
#   "verify:properties": "node tools/business-verification/verify.mjs --root ."  (optional Goal 3)
#   "project:status":    "node tools/project-status/generate.mjs --root ."  (optional status report)
# and `typescript` in devDependencies (the verifiers resolve it from the project).
#
# fetch-depth: 0 is required: project:status walks git history to attribute
# lifecycle transitions; a shallow clone degrades it (commits reported as null).
# Warnings (HGS006 legacy status.md, HGW001/HGW002 gap drift) never fail the
# job; verify-spec prints them last and, under GitHub Actions, as ::warning
# annotations. .hgate/status.json is derived output: gitignore .hgate/.
# Bitbucket Pipelines equivalent: templates/ci/bitbucket-pipelines.hgate.yml.
name: hgate-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hgate-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: hGATE project projection is in sync
        run: |
          if [ -f docs/domain-map.md ]; then
            npm run --silent project:check
          else
            echo "No docs/domain-map.md; projection not adopted."
          fi
      - name: Specification consistency (skipped when verify-spec is not installed)
        run: |
          if [ -f tools/verify-spec/verify.mjs ]; then
            npm run --silent verify:spec -- --phase implementation
          fi
      - name: BDD scenario-to-test traceability
        run: npm run --silent verify:bdd
      - name: Business-property traceability (skipped when no properties.md exists)
        run: |
          if ls .github/skills/*/properties.md >/dev/null 2>&1; then
            npm run --silent verify:properties
          else
            echo "No properties.md found; Goal 3 not adopted."
          fi
      # Optional: git-derived status report for later hosted reports. Never
      # fails the job; remove both steps if you do not want the artifact.
      - name: hGATE status report (optional)
        if: always()
        continue-on-error: true
        run: |
          if [ -f tools/project-status/generate.mjs ]; then
            npm run --silent project:status
          else
            echo "tools/project-status not installed; status report skipped."
          fi
      - name: Upload hGATE status report (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hgate-status
          path: .hgate/status.json
          if-no-files-found: ignore
      # Keep your normal unit tests as a separate step or job.
      - run: npm test
